name: Firebase keys

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Download and send Google's Firebase keys
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          RELAY_SECRET: ${{ secrets.FIREBASE_RELAY_SECRET }}
        run: |
          curl -fsS https://www.googleapis.com/robot/v1/metadata/x509/securetoken@system.gserviceaccount.com -o keys.json
          curl -fsS -X POST -H "Content-Type: application/json" -H "X-Relay-Secret: $RELAY_SECRET" --data-binary @keys.json "$SITE_URL/api/firebase-keys.php"
